[project]
name = "kusai-mastodon"
version = "0.3.0"
requires-python = ">=3.12"

dependencies = [
    "adblock>=0.6.0",
    "beautifulsoup4>=4.14.3",
    "kusai>=0.12.2",
    "mastodon-py>=2.1.4",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kusai_mastodon"]
